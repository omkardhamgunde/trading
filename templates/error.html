<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - 429</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --accent-red: #ef4444;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(239, 68, 68, 0.3);
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Roboto', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(239, 68, 68, 0.15) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(239, 68, 68, 0.1) 0%, transparent 20%);
            overflow: hidden;
        }

        .error-container {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(239, 68, 68, 0.1) inset;
            position: relative;
            z-index: 10;
        }

        .error-icon {
            font-size: 5rem;
            color: var(--accent-red);
            margin-bottom: 1.5rem;
            animation: pulse 2s infinite;
            filter: drop-shadow(0 0 20px rgba(239, 68, 68, 0.6));
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            margin: 0 0 0.5rem 0;
            color: var(--text-light);
            letter-spacing: 2px;
        }

        .error-code {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--accent-red);
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: transparent;
            color: var(--text-light);
            border: 1px solid var(--glass-border);
            padding: 0.875rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-home::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(239, 68, 68, 0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .btn-home:hover {
            border-color: var(--accent-red);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3), inset 0 0 10px rgba(239, 68, 68, 0.2);
        }

        .btn-home:hover::before {
            transform: translateX(100%);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; filter: drop-shadow(0 0 30px rgba(239, 68, 68, 0.8)); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Scanline effect */
        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 0, 0, 0.1) 51%
            );
            background-size: 100% 4px;
            z-index: 1;
            pointer-events: none;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <i class="fas fa-shield-halved error-icon"></i>
        <h1>SECURITY</h1>
        <div class="error-code">429 - BRUTE FORCE BLOCKED</div>
        <p>{{ error_msg | default("Our automated defense systems have detected anomalous traffic patterns from your IP address. Connection temporarily blocked.") }}</p>
        <a href="/" class="btn-home">
            <i class="fas fa-arrow-left"></i> Return to Safety
        </a>
    </div>
</body>
</html>
